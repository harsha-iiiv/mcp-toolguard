# mcp-toolguard policy file (v0.1)
#
# Lookup order when --policy is not given:
#   ./toolguard.yaml, ./toolguard.yml, ./toolguard.json, then the built-in defaults.
# Every field is optional. Anything you leave out gets the default shown here.
# Validate with:  mcp-toolguard check-policy toolguard.yaml

version: 1

# enforce: block decisions are applied (tools hidden, calls refused, results replaced).
# monitor: nothing is blocked. Would-be blocks are downgraded to warnings and logged
#          with wouldBlock: true. Same as passing --monitor to `mcp-toolguard run`.
mode: enforce

tools:
  # Glob patterns ('*' and '?' only) matched against tool names.
  # Empty allow list = every tool is allowed (subject to detection rules).
  allow: []
  # Deny wins over allow. Calls to a denied tool are blocked.
  # Example: never let the model delete or move files through this server:
  #   deny:
  #     - "delete_*"
  #     - "move_file"
  deny: []
  # Action for a tools/call to a tool not matched by `allow` (only used when allow is non-empty).
  unlisted: block
  # Action for a tools/call to a tool the server never advertised in tools/list.
  unknown: warn

# Default action for a finding of each severity, when no rule override applies.
# Actions: allow < warn < block. The strongest action across all findings wins.
severityActions:
  low: allow
  medium: warn
  high: block
  critical: block

# Per-rule overrides, keyed by rule id. Built-in rule ids:
#   tool-poisoning, hidden-unicode, rug-pull, tool-shadowing, secret-exfiltration,
#   sensitive-path, command-injection, result-injection, secret-in-result
# Each override may set:
#   enabled:  false to switch the rule off entirely (default true)
#   action:   allow | warn | block, used instead of severityActions
#   severity: low | medium | high | critical, re-labels the rule's findings
rules:
  # Example: treat any secret in a tool result as critical (and therefore blocked).
  secret-in-result:
    severity: critical
  # Example: a server that legitimately takes shell snippets. Uncomment to only warn.
  #   command-injection:
  #     action: warn
  # Example: switch a rule off entirely.
  #   hidden-unicode:
  #     enabled: false

# Argument constraints applied to every tools/call.
#   tool:   glob on the tool name
#   path:   dot path into the arguments ("path", "options.url"); '*' = every top-level string argument
#   deny:   regexes (JS syntax, case-insensitive); any match triggers `action`
#   allow:  regexes; if set, the value must match at least one, otherwise `action` triggers
#   action: allow | warn | block (default block)
#   reason: shown in the block message and the audit log
arguments:
  - tool: "run_command"
    path: "command"
    deny:
      - "rm\\s+-rf"
      - "curl[^|]*\\|\\s*(ba)?sh"
    action: block
    reason: "destructive or remote-code shell command"
  # Example allow-list rule: only permit reads under one directory.
  #   - tool: "read_file"
  #     path: "path"
  #     allow:
  #       - "^/home/me/projects/"
  #     reason: "reads are limited to the projects directory"

pins:
  # Trust-on-first-use fingerprints of every tool definition. A changed definition
  # (rug pull) is blocked until you run `mcp-toolguard pins reset`.
  # '~' expands to your home directory. The built-in default lives under
  # $MCP_TOOLGUARD_HOME (default ~/.mcp-toolguard); a path set here is used as written.
  file: ~/.mcp-toolguard/pins.json

spend:
  maxSpendPerTaskUsd: null   # e.g. 2 to block calls once a task has spent $2
  costs: {}                  # USD per call by tool glob, e.g. { "brave_*": 0.005 }
  defaultCostUsd: 0
approval:
  tools: []                  # globs that need `mcp-toolguard approve <id>`
  file: ~/.mcp-toolguard/approvals.json
learning:
  enabled: false             # or run --learning; warns only
  file: ~/.mcp-toolguard/baseline.json
  minSamples: 50
plugins:
  enabled: false             # or run --plugins <dir>; in-process code, opt-in
  dir: ./toolguard-plugins

audit:
  # Append-only, hash-chained JSONL log. Check integrity with `mcp-toolguard verify-log <file>`.
  file: ~/.mcp-toolguard/audit.jsonl
  # Redact secrets (API keys, tokens, private keys) before they are written.
  redact: true
  # Also log allowed traffic that had no findings. Set false for a smaller log.
  logAllowed: true
